name: yvnalvworks-content-ideas
version: 0.4.0
description: >
  Researches, validates, and structures evidence-backed technical content ideas (carousels, reels video scripts, articles, engineering breakdowns) for yvnalvworks as friendly, easy-to-follow technical stories, with source citations and Notion content planner sync.
domain: creative-media
type: specialized
requires:
  - python>=3.10
tags: [yvnalvworks, content-ideas, ai-engineering, computer-vision, edge-ai, systems-architecture, carousels, notion-sync]

# --- Skill-specific policy ---

intake_gate:
  mandatory_questions:
    - topic_angle
    - platform_format
    - output_destination

story_beats:
  reference: references/yvnalvworks-voice-and-tone-guide.md
  total_beats: 5
  beats:
    - id: 1
      name: the_moment
      json_key: hookStatement
    - id: 2
      name: the_problem
      json_key: industryTension
    - id: 3
      name: the_turn
      json_key: architecturalFramework
    - id: 4
      name: the_lesson
      json_key: goldenRule
    - id: 5
      name: the_next_step_and_cta
      json_key: takeawayAndCta
  carousel_slides: 5-10

reels:
  package_script: scripts/build_reel_package.py
  input: reel.json
  visual_plan: one_animated_visual_per_beat
  duration_seconds: 40-60
  words_per_minute: 140
  closed_captions:
    case: sentence
    words_per_cue: 3-6
    max_chars_per_cue: 32
    break_at: natural_phrase

notion_sync:
  database_id: "5a915afd-b3c1-8274-836c-87fe398765ee"
  parent_page_id: "23715afd-b3c1-8005-a71d-d220cf1c636f"
  default_status: "Idea 💡"

cover_headline:
  reference: references/cover-headline-patterns.md
  lines: 3-4
  max_chars_per_line: 18
  highlight_phrases: 1
  highlight_markup: "[[...]]"

rules:
  ban_em_dash: true
  mandatory_evidence_sources: true
  language_english_only: true
  storytelling_voice: true
  no_fragment_stacks: true
  no_ai_voiceover_synthesis: true
  manual_voiceover_teleprompter_required: true
  no_unrequested_design_generation: true
